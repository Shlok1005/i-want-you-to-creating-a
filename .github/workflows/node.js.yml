name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Compile server
      run: python3 -m py_compile server.py
    - name: Smoke test health endpoint
      run: |
        ADMIN_TOKEN=ci-test-token python3 server.py &
        pid=$!
        trap 'kill $pid' EXIT
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8000/api/health >/tmp/fg-health.json; then
            break
          fi
          sleep 0.2
        done
        grep -q '"ok": true' /tmp/fg-health.json
        # Dynamic public content APIs
        curl -sf http://127.0.0.1:8000/api/content | grep -q '"coaches"'
        curl -sf http://127.0.0.1:8000/api/live | grep -q '"pulse"'
        curl -sf -X POST http://127.0.0.1:8000/api/match \
          -H 'Content-Type: application/json' \
          -d '{"goal":"yoga","experience":"beginner","preference":"in-person"}' \
          | grep -q '"ok": true'
        # Easy backend entry points
        curl -sf http://127.0.0.1:8000/api/backend-info | grep -q '"backendUrl"'
        code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/backend)
        test "$code" = "200"
        # Admin data must require a token
        code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/admin-data)
        test "$code" = "401"
        # Valid token succeeds
        curl -sf -H "X-Admin-Token: ci-test-token" http://127.0.0.1:8000/api/submissions | grep -q '"ok": true'
        # Sensitive files must not be served
        code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/server.py)
        test "$code" = "404"
        code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/.env.example)
        test "$code" = "404"
