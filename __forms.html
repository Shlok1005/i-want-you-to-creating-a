<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fitness Gurukul form detection</title>
</head>
<body>
  <!-- Static skeletons so Netlify detects JS-rendered lead forms at build time. -->

  <form name="consultation" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="consultation" />
    <input name="bot-field" />
    <input name="form_type" />
    <input name="subject" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="program" />
    <input name="goal" />
    <input name="message" />
    <input name="coach" />
    <input name="location" />
    <input name="source" />
    <input name="timestamp" />
  </form>

  <form name="challenge" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="challenge" />
    <input name="bot-field" />
    <input name="form_type" />
    <input name="subject" />
    <input name="name" />
    <input name="phone" />
    <input name="email" />
    <input name="program" />
    <input name="goal" />
    <input name="message" />
    <input name="location" />
    <input name="source" />
    <input name="timestamp" />
  </form>

  <form name="corporate" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="corporate" />
    <input name="bot-field" />
    <input name="form_type" />
    <input name="subject" />
    <input name="company" />
    <input name="contact_name" />
    <input name="email" />
    <input name="phone" />
    <input name="event_type" />
    <input name="attendees" />
    <input name="preferred_date" />
    <input name="budget" />
    <input name="location" />
    <input name="message" />
    <input name="source" />
    <input name="timestamp" />
  </form>
</body>
</html>
