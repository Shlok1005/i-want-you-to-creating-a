app = "fitness-gurukul-api"
primary_region = "sin"

[build]
  builtin = "python"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  CORS_ORIGINS = "*"
